services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bytefix-sql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - bytefix-sql-data:/var/opt/mssql

volumes:
  bytefix-sql-data:
